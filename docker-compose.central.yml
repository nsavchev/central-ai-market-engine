services:
  central-ai:
    build:
      context: .
      dockerfile: central_ai/Dockerfile
    restart: unless-stopped
    env_file: .env.central
    ports:
      - "127.0.0.1:8010:8010"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - central_ai_tasks:/var/lib/central-ai
    environment:
      CENTRAL_TASK_API_ENABLED: "NO"
      CENTRAL_TASK_DB: /var/lib/central-ai/tasks.sqlite
    mem_limit: 512m

volumes:
  central_ai_tasks:
