name: Stage 2 PostgreSQL startup DDL guard
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./startup_guard_ci.db
      API_TOKEN: ci-only-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_stage2_postgres_startup_guard.py
