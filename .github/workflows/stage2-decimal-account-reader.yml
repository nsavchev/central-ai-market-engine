name: Stage 2 Decimal account reader
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./account_read_test_only.db
      API_TOKEN: test-only-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_stage2_decimal_account_reader.py
