name: Stage 2 baseline read-only contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:local-test-only@127.0.0.1:5432/test
      STAGE2_DISPOSABLE_DB: YES
      DATABASE_URL: sqlite:///./baseline_ci_only.db
      API_TOKEN: ci-only-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt 'alembic>=1.13,<2'
      - run: python -m pytest -q tests/test_stage2_baseline_contract.py tests/test_stage2_legacy_column_contract.py tests/test_stage2_baseline_postgres.py tests/test_market_role_image_rehearsal.py tests/test_market_role_cutover_prepare.py

      - name: Build historical source fixture for isolated image rehearsal
        run: |
          fixture_dir=$(mktemp -d)
          git archive d987387f45dbe25940502ea25542e7ad99673359 app Dockerfile requirements.txt | tar -x -C "$fixture_dir"
          python - "$fixture_dir" <<'PYCODE'
          import sys
          from pathlib import Path
          root=Path(sys.argv[1])
          dockerfile=root/'Dockerfile'
          lines=dockerfile.read_text().splitlines()
          lines[0]=Path('release/Dockerfile.release').read_text().splitlines()[0]
          dockerfile.write_text('\n'.join(lines)+'\n')
          PYCODE
          docker build -t market-role-ci-fixture "$fixture_dir"
      - name: Exact-image isolated startup and restricted-login acceptance
        run: |
          api_image=$(docker image inspect market-role-ci-fixture --format '{{.Id}}')
          pg_image=$(docker image inspect postgres:16-alpine --format '{{.Id}}')
          python scripts/market_role_image_rehearsal.py \
            --api-image "$api_image" --postgres-image "$pg_image" \
            --expected-manifest 228f6ebc4c89bf313cba326008e46958fbca9c35d0461d820753b3fe2922edf2 \
            --schema-file tests/fixtures/vps_legacy_schema_20261103.sql \
            --schema-sha256 4082aa5af9b7c08abcce5c6249962754e9e9a9ee7cc1be035c3cdf525aa002ec
