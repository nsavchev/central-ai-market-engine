name: Stage 2 baseline read-only contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./baseline_ci_only.db
      API_TOKEN: ci-only-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'alembic>=1.13,<2'
      - run: python -m pytest -q tests/test_stage2_baseline_contract.py
