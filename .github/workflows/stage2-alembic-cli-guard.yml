name: Stage 2 Alembic CLI fail-closed
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'alembic>=1.13,<2'
      - run: python -m pytest -q tests/test_stage2_alembic_cli_fail_closed.py
