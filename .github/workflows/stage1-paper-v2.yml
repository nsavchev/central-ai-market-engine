name: Stage 1 guarded Paper V2 API tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./stage1_test_only.db
      API_TOKEN: test-unguessable-token-not-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest "psycopg[binary]"
      - run: python -m pytest -q tests/test_stage1_paper_v2_gates.py
