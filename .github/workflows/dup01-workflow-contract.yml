name: DUP-01 workflow ownership contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q tests/test_dup01_workflow_ownership.py tests/test_ai01_worker_lifecycle_audit.py tests/test_ai01_task_api_optin.py
