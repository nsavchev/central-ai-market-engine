name: P0 locked isolated image candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locked-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version-controlled release lock and immutable base
        run: |
          set -eu
          mkdir -p release-evidence
          python -c 'from central_ai.release_build_policy import validate_release_dockerfile; assert validate_release_dockerfile("release/Dockerfile.release")'
          cp release/requirements-linux-amd64.lock release-evidence/requirements-linux-amd64.lock
          cp release/Dockerfile.release release-evidence/Dockerfile.release
          sha256sum release/requirements-linux-amd64.lock release/Dockerfile.release > release-evidence/source-sha256.txt
          python -m pip download --only-binary=:all: --require-hashes -r release/requirements-linux-amd64.lock -d release-evidence/wheels
          test "$(find release-evidence/wheels -name '*.whl' -type f | wc -l)" -eq 17
          python -m pip install --dry-run --no-index --find-links release-evidence/wheels --require-hashes -r release/requirements-linux-amd64.lock > release-evidence/lock-validation.txt
          rm -rf release-evidence/wheels
      - name: Build from pinned source twice and inspect runtime
        run: |
          set -eu
          BASE='python@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30'
          grep -Fxq "FROM $BASE" release/Dockerfile.release
          docker pull "$BASE"
          printf '%s\n' "$BASE" > release-evidence/base-image.txt
          docker build -f release/Dockerfile.release -t central-ai-locked-ci:local .
          docker image inspect central-ai-locked-ci:local --format '{{.Id}}' > release-evidence/candidate-image-id.txt
          docker run --rm --network none --entrypoint python central-ai-locked-ci:local -m pip freeze --all > release-evidence/installed-dependencies.txt
          docker run --rm --network none --entrypoint python central-ai-locked-ci:local -c 'import fastapi,httpx,starlette,uvicorn; print("LOCKED_IMAGE_IMPORT_PASSED")' > release-evidence/import-smoke.txt
          docker build --no-cache -f release/Dockerfile.release -t central-ai-locked-rebuild:local .
          docker image inspect central-ai-locked-rebuild:local --format '{{.Id}}' > release-evidence/rebuilt-image-id.txt
          docker run --rm --network none --entrypoint python central-ai-locked-rebuild:local -m pip freeze --all > release-evidence/rebuilt-dependencies.txt
          cmp release-evidence/installed-dependencies.txt release-evidence/rebuilt-dependencies.txt
          docker run --rm --network none --entrypoint python central-ai-locked-rebuild:local -c 'import fastapi,httpx,starlette,uvicorn; print("LOCKED_IMAGE_IMPORT_PASSED")' > release-evidence/rebuilt-import-smoke.txt
          cmp release-evidence/import-smoke.txt release-evidence/rebuilt-import-smoke.txt
          echo "CI package and import equality only; byte-for-byte image reproducibility not proven." > release-evidence/comparison-scope.txt
          sha256sum release-evidence/* > release-evidence/manifest.sha256
      - name: Archive source-controlled release evidence (never deploy)
        uses: actions/upload-artifact@v4
        with:
          name: p0-locked-image-candidate
          path: release-evidence/
          retention-days: 14
