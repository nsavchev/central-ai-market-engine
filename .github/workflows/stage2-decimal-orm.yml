name: Stage 2 Decimal ORM contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite:///./stage2_orm_test_only.db
      API_TOKEN: test-token-no-production-access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest 'alembic>=1.13,<2'
      - run: python -m pytest -q tests/test_stage2_decimal_orm.py
