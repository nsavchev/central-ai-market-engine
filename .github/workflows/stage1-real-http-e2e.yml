name: Stage 1 real FastAPI Paper V2 HTTP integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:local-test-only@127.0.0.1:5432/test
      DATABASE_URL: sqlite:///./stage1_ci_only.db
      API_TOKEN: stage1-ci-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt pytest "psycopg[binary]"
      - run: python -m pytest -q tests/test_stage1_real_http_e2e.py tests/test_engine.py tests/test_advanced_valuation.py tests/test_data_quality.py tests/test_fundamentals.py tests/test_fundamentals_history.py tests/test_macro.py tests/test_scanner.py tests/test_sec_financials.py tests/test_valuation.py
