name: AI-19 real functional Docker smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functional-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pull digest-pinned Python image
        run: |
          docker pull python:3.12-alpine
          docker image inspect python:3.12-alpine --format '{{index .RepoDigests 0}}' > /tmp/ai19-image.txt
          grep -Eq '^python@sha256:[0-9a-f]{64}$' /tmp/ai19-image.txt
      - name: Real functional Docker pass and fail
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          import tempfile
          from pathlib import Path
          from central_ai.isolated_functional_verifier import run_functional_tests
          image = Path("/tmp/ai19-image.txt").read_text().strip()
          with tempfile.TemporaryDirectory() as directory:
              candidate = Path(directory) / "candidate.py"
              test = Path(directory) / "test_candidate.py"
              candidate.write_text("def multiply(a, b):\n    return a * b\n")
              test.write_text("import sys\nsys.path.insert(0, '/sandbox')\nfrom candidate import multiply\nassert multiply(3, 4) == 12\n")
              digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
              candidate_bytes=candidate.read_bytes()
              test_bytes=test.read_bytes()
              def replace_inputs_then_run(args,**kwargs):
                  # Mutation after validation, before the actual Docker invocation.
                  candidate.write_text("raise RuntimeError('original replaced')\\n")
                  test.write_text("raise RuntimeError('test replaced')\\n")
                  return subprocess.run(args,**kwargs)
              good = run_functional_tests(enabled="YES", candidate=str(candidate), expected_sha256=digest, test_file=str(test), expected_test_sha256=hashlib.sha256(test.read_bytes()).hexdigest(), image=image, run=replace_inputs_then_run)
              assert good["status"] == "passed", good
              candidate.write_bytes(candidate_bytes)
              test.write_bytes(test_bytes)
              print("FROZEN_INPUT_REPLACEMENT_PASSED")
              test.write_text("import sys\nsys.path.insert(0, '/sandbox')\nfrom candidate import multiply\nassert multiply(3, 4) == 99\n")
              bad = run_functional_tests(enabled="YES", candidate=str(candidate), expected_sha256=digest, test_file=str(test), expected_test_sha256=hashlib.sha256(test.read_bytes()).hexdigest(), image=image)
              assert bad["status"] == "failed", bad
              test.write_text("raise SystemExit(0)\n")
              early = run_functional_tests(enabled="YES", candidate=str(candidate), expected_sha256=digest,
                  test_file=str(test), expected_test_sha256=hashlib.sha256(test.read_bytes()).hexdigest(), image=image)
              assert early['status'] == 'completion_unconfirmed' and early['passed'] is False, early
              candidate.write_text("import os\nos._exit(0)\n")
              def forbidden(*args, **kwargs):
                  raise AssertionError('unsupported candidate must not reach Docker')
              try:
                  run_functional_tests(enabled="YES", candidate=str(candidate),
                      expected_sha256=hashlib.sha256(candidate.read_bytes()).hexdigest(), test_file=str(test),
                      expected_test_sha256=hashlib.sha256(test.read_bytes()).hexdigest(), image=image, run=forbidden)
              except ValueError as error:
                  assert str(error) == 'CANDIDATE_OUTSIDE_EXECUTION_POLICY'
              else:
                  raise AssertionError('candidate early-exit code accepted')
              print("AI19_REAL_FUNCTIONAL_AND_EARLY_EXIT_GATES_PASSED")
          PY
      - name: Real bounded pipeline with synthetic authorization and durable outcome
        run: |
          python -m pip install -r requirements.txt
          python - <<'PY'
          import hashlib
          import hmac
          import json
          import secrets
          import subprocess
          import tempfile
          from pathlib import Path
          from central_ai.persistent_bridge import PersistentTaskBridge
          from central_ai.task_file_targets import TaskFileTargets
          from central_ai.task_storage import TaskStorage
          from central_ai.worker_batch import run_batch
          from central_ai.verifier_gate import make_hmac_review_authorizer
          from central_ai.verified_review_pipeline import prepare_and_verify
          from datetime import datetime, timezone, timedelta
          def authorize_generation(binding):
              # Synthetic allowance, not real provider prices or production authority.
              now = datetime.now(timezone.utc)
              return dict(schema='generation-admission-v1', generation_authorized=True,
                  binding=dict(binding), scope='generate_only', disclosure='task_description_only',
                  authorization_id='ci-'+binding['nonce'], budget_period=now.strftime('%Y-%m'),
                  budget_limit_microuros=1000000, budget_call_limit=100, reserved_microuros=1000,
                  model='ci-fixture-model', max_output_tokens=100,
                  expires_at=(now+timedelta(minutes=1)).isoformat(), approved=False, deployment_allowed=False)
          image = Path('/tmp/ai19-image.txt').read_text().strip()
          # Ephemeral synthetic CI authority only; no production reviewer provisioning.
          key = secrets.token_bytes(32)
          def issue_receipt(binding):
              receipt = dict(schema='review-hmac-sha256-v1', binding=dict(binding),
                  reviewer_id='ci-synthetic-reviewer', authorization_id='ci-fixture-only',
                  issued_at=1000, expires_at=1100, verification_authorized=True,
                  approved=False, deployment_allowed=False)
              payload = json.dumps(receipt, sort_keys=True, separators=(',', ':'), allow_nan=False).encode()
              return dict(receipt, mac=hmac.new(key, payload, 'sha256').hexdigest())
          authorize = make_hmac_review_authorizer(reviewer_keys={'ci-synthetic-reviewer':key},
              request_receipt=issue_receipt, clock=lambda:1050)
          def containers():
              return {name for name in subprocess.check_output(
                  ['docker', 'container', 'ls', '--all', '--format', '{{.Names}}'], text=True).splitlines()
                  if name.startswith('central-ai-verifier-')}
          before = containers()
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              database = root/'tasks.sqlite'
              source = root/'source'; source.mkdir()
              original = source/'sample.py'; original.write_text('def f(): return 1\n')
              original_bytes = original.read_bytes()
              bridge = PersistentTaskBridge(database)
              targets = TaskFileTargets(database); targets.initialize()
              for expected, expression in [('passed', '== 2'), ('failed', '== 99'), ('completion_unconfirmed', None)]:
                  task_id = bridge.submit('Synthetic real Docker lifecycle '+expected)['task_id']
                  targets.register(task_id, str(source), 'sample.py')
                  assert run_batch(enabled='YES', database=str(database), agent='ci-lifecycle',
                      max_tasks=1, idle_checks=1, sleep=lambda _:None)['processed'] == 1
                  paths = []
                  for name in ('handoffs', 'proposals', 'candidates'):
                      path = root/(expected+'-'+name); path.mkdir(mode=0o700); paths.append(str(path))
                  test = root/(expected+'_test.py')
                  test.write_text("raise SystemExit(0)\n" if expression is None else
                      "import sys\nsys.path.insert(0, '/sandbox')\nfrom candidate import f\nassert f() "+expression+"\n")
                  params = dict(enabled='YES', database=str(database), task_id=task_id,
                      handoffs=paths[0], proposals=paths[1], candidates=paths[2],
                      recommendation='```python\ndef f(): return 2\n```', trusted_test_file=str(test),
                      trusted_test_sha256=hashlib.sha256(test.read_bytes()).hexdigest(),
                      image=image, authorization_check=authorize)
                  report = prepare_and_verify(**params)
                  audit = TaskStorage(database).get(task_id)['verification']
                  assert report['test_status'] == expected
                  assert report['tests_passed'] is (expected == 'passed')
                  assert report['completion_confirmed'] is (expected == 'passed')
                  assert report['execution_policy'] == 'bounded-arithmetic-v1'
                  assert report['audit_recorded'] and audit['phase'] == 'completed'
                  assert audit['outcome']['verification_binding'] == report['verification_binding']
                  assert audit['resources']['container_name'].startswith('central-ai-verifier-')
                  assert not Path(audit['resources']['snapshot_directory']).exists()
                  assert report['approved'] is report['deployment_allowed'] is False
                  assert bridge.status(task_id)['status'] == 'analyzed'
                  assert original.read_bytes() == original_bytes
                  try:
                      prepare_and_verify(**params)
                  except ValueError as error:
                      assert str(error) == 'VERIFICATION_ALREADY_STARTED'
                  else:
                      raise AssertionError('replay accepted')
                  assert containers() == before
              # One fixed independent test across generated root and linked correction.
              task_id = bridge.submit('Synthetic generated arithmetic correction')['task_id']
              targets.register(task_id, str(source), 'sample.py')
              frozen_test = root/'revision_test.py'
              frozen_test.write_text("import sys\nsys.path.insert(0, '/sandbox')\nfrom candidate import f\nassert f() == 2\n")
              test_digest = hashlib.sha256(frozen_test.read_bytes()).hexdigest()
              root_id = task_id
              for ordinal in (1, 2):
                  assert run_batch(enabled='YES', database=str(database), agent='ci-generated-revision',
                      max_tasks=1, idle_checks=1, sleep=lambda _:None)['processed'] == 1
                  paths=[]
                  for name in ('handoffs','proposals','candidates'):
                      path=root/('revision-'+str(ordinal)+'-'+name);path.mkdir(mode=0o700);paths.append(str(path))
                  import os, httpx
                  from central_ai.app import make_openai_generator
                  os.environ['OPENAI_API_KEY']='synthetic-ci-only'
                  os.environ['OPENAI_MODEL']='unapproved-environment-model'
                  def mock_provider(request):
                      persisted = TaskStorage(database).get(task_id)['generation']
                      assert persisted['binding']['root_task_id'] == root_id
                      assert persisted['binding']['ordinal'] == ordinal
                      assert persisted['admission']['receipt']['generation_authorized'] is True
                      body=json.loads(request.content)
                      assert body['model']=='ci-fixture-model' and body['max_tokens']==100
                      assert body['messages']==[dict(role='user',content='Synthetic generated arithmetic correction')]
                      assert persisted['dispatch']['admission_sha256']==persisted['admission_sha256']
                      answer='```python\ndef f(): return '+str(ordinal)+'\n```'
                      return httpx.Response(200,stream=httpx.ByteStream(json.dumps(
                          dict(choices=[dict(message=dict(content=answer))])).encode()))
                  generate=make_openai_generator(enabled='YES',database=str(database),
                      transport=httpx.MockTransport(mock_provider))
                  report=prepare_and_verify(enabled='YES', database=str(database),task_id=task_id,
                      handoffs=paths[0],proposals=paths[1],candidates=paths[2],
                      trusted_test_file=str(frozen_test),trusted_test_sha256=test_digest,image=image,
                      authorization_check=authorize,generator=generate,generator_id=generate.generator_id,
                      generation_authorization_check=authorize_generation)
                  audit=TaskStorage(database).get(task_id)
                  assert audit['generation']['phase']=='completed'
                  assert report['test_status']==('failed' if ordinal==1 else 'passed')
                  assert report['approved'] is report['deployment_allowed'] is False
                  assert original.read_bytes()==original_bytes and containers()==before
                  if ordinal==1:
                      task_id=bridge.submit_revision(task_id,report['verification_nonce'])['task_id']
              assert len(TaskStorage(database).get(root_id)['revision_family']['members'])==2
              print('MOCK_OPENAI_ADAPTER_REAL_DOCKER_FAILED_ROOT_LINKED_CORRECTION_PASSED')
              print('SYNTHETIC_AUTH_REAL_DOCKER_DURABLE_COMPLETION_AND_REPLAY_PASSED')
              from scripts.openai_admitted_acceptance import run_e2e_case
              e2e_case=root/'operator-e2e'; e2e_case.mkdir(mode=0o700)
              def e2e_factory(database):
                  def response(request):
                      payload=json.loads(request.content)
                      assert payload['model']=='gpt-4.1-mini' and payload['max_tokens']==128
                      answer='```python\ndef f(a, b):\n    return a * b\n```'
                      return httpx.Response(200,stream=httpx.ByteStream(json.dumps(
                          dict(choices=[dict(message=dict(content=answer))])).encode()))
                  return make_openai_generator(enabled='YES',database=database,transport=httpx.MockTransport(response))
              accepted=run_e2e_case(e2e_case,image,generator_factory=e2e_factory)
              assert accepted['acceptance']=='passed',accepted
              assert accepted['provider_mode']=='mock' and accepted['verifier_mode']=='docker'
              assert accepted['source_unchanged'] and accepted['trusted_tests_unchanged'] and accepted['snapshot_removed']
              assert accepted['generation_completed'] and accepted['verification_journal_completed']
              assert not accepted['worker_activated'] and not accepted['approved'] and not accepted['deployment_allowed']
              assert containers()==before
              print('MOCK_OPENAI_OPERATOR_E2E_REAL_DOCKER_PASSED')
              from central_ai.verified_review_pipeline import make_worker_review_handler
              from central_ai.worker_scheduler import scheduled_cycles
              from central_ai.worker_supervised import run_supervised
              case=root/'review-worker'; case.mkdir(mode=0o700)
              worker_db=case/'tasks.sqlite'
              worker_source=case/'source'; worker_source.mkdir()
              worker_original=worker_source/'sample.py'; worker_original.write_text('def f(a,b): return a+b\n')
              worker_bytes=worker_original.read_bytes()
              worker_bridge=PersistentTaskBridge(worker_db)
              worker_task=worker_bridge.submit('Implement def f(a,b) to return a*b as one fenced python block.')['task_id']
              worker_targets=TaskFileTargets(worker_db); worker_targets.initialize()
              worker_targets.register(worker_task,str(worker_source),'sample.py')
              worker_test=case/'test.py'; worker_test.write_bytes((e2e_case/'trusted_test.py').read_bytes())
              worker_test_digest=hashlib.sha256(worker_test.read_bytes()).hexdigest()
              job=dict(trusted_test_file=str(worker_test),trusted_test_sha256=worker_test_digest,image=image)
              for name in ('handoffs','proposals','candidates'):
                  path=case/name;path.mkdir(mode=0o700);job[name]=str(path)
              underlying=e2e_factory(str(worker_db))
              worker_calls=[]
              def worker_generate(request):
                  worker_calls.append(request['binding']['nonce'])
                  return underlying(request)
              def worker_admit(binding):
                  return dict(authorize_generation(binding),model='gpt-4.1-mini',max_output_tokens=128,budget_call_limit=1)
              handler=make_worker_review_handler(enabled='YES',database=str(worker_db),jobs={worker_task:job},
                  generator=worker_generate,generator_id=underlying.generator_id,
                  generation_authorization_check=worker_admit,authorization_check=authorize)
              def bounded_batch(**kwargs):return run_batch(**kwargs,idle_checks=1,sleep=lambda _:None)
              def bounded_schedule(**kwargs):return scheduled_cycles(**kwargs,batch=bounded_batch,sleep=lambda _:None)
              worked=run_supervised(enabled='YES',database=str(worker_db),agent='ci-explicit-review',
                  lock_path=str(case/'worker.lock'),status_path=str(case/'status.json'),cycles=3,interval=1,
                  max_tasks=1,scheduler=bounded_schedule,review_handler=handler)
              assert worked['processed']==1 and len(worker_calls)==1
              worker_saved=TaskStorage(worker_db).get(worker_task)
              assert worker_saved['generation']['phase']=='completed' and worker_saved['verification']['phase']=='completed'
              assert worker_saved['verification']['outcome']['tests_passed']
              assert not worker_saved['approved'] and not worker_saved['deployment_allowed']
              assert worker_original.read_bytes()==worker_bytes
              assert hashlib.sha256(worker_test.read_bytes()).hexdigest()==worker_test_digest
              assert containers()==before
              print('EXPLICIT_WORKER_REVIEW_THREE_CYCLES_ONE_GENERATION_REAL_DOCKER_PASSED')
          PY
