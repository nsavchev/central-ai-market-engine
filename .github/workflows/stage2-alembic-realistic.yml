name: Stage 2 realistic Alembic migration CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  populated-history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://test:local-test-only@127.0.0.1:5432/test
      DATABASE_URL: sqlite:///./stage2_ci_only.db
      STAGE2_DISPOSABLE_DB: YES
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt 'alembic>=1.13,<2'
      - run: python -m pytest -q tests/test_stage2_alembic_realistic_migration.py
