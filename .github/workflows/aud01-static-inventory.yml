name: AUD-01 static Python inventory
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_aud01_static_inventory.py
      - run: python -m tools.audit_python_ownership --root . > /tmp/python-ownership-inventory.json
